<div class="card-container"
     (contextmenu)="onRightClick($event)"
     [style.transform]="'rotate(' + totalRotation + 'deg)'">

  <ng-container *ngIf="cell; else empty">
    <img [src]="image" class="card-image"/>
  </ng-container>

  <ng-template #empty>
    <div class="card-empty"></div>
  </ng-template>

</div>
